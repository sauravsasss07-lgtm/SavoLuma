<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  // Synchronous pre-render access check. Runs before any CSS/body paints,
  // so an unauthenticated or wrong-role visit never shows so much as a
  // flash of this page's shell — it redirects immediately. This is a
  // client-side hardening layer; the actual security boundary is the
  // backend REST API (see backend/src/main/java/com/savoluma/config/
  // SecurityConfig.java), which independently rejects any request without
  // a valid EMPLOYEE JWT regardless of what the browser does here.
  (function() {
    try {
      var raw = localStorage.getItem('savoluma_session_v1');
      var session = raw ? JSON.parse(raw) : null;
      if (!session || session.role !== 'EMPLOYEE') {
        window.location.replace('employee-login.html');
      }
    } catch (e) {
      window.location.replace('employee-login.html');
    }
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Dashboard — SavoLuma</title>
<link rel="icon" type="image/jpeg" href="../assets/images/favicon.jpeg">
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/employee-dashboard.css">
</head>
<body class="dash-body">

<div class="dash-shell">
  <aside class="dash-sidebar">
    <div class="brand-row"><img src="../assets/images/logo.jpeg" alt="SavoLuma"></div>
    <div class="role-pill">EMPLOYEE WORKSPACE</div>
    <nav class="dash-nav">
      <button class="active" data-panel="panel-profile" data-title="My Profile">My Profile</button>
      <button data-panel="panel-team" data-title="My Team">My Team</button>
      <button data-panel="panel-projects" data-title="My Projects">My Projects</button>
      <button data-panel="panel-tasks" data-title="My Tasks">My Tasks</button>
      <button data-panel="panel-leave" data-title="My Leave Requests">My Leave Requests</button>
    </nav>
    <div class="sidebar-footer">
      <div class="user-row">
        <div class="avatar-circle" id="sidebarAvatar"></div>
        <div><div class="user-name" id="sidebarUserName"></div><div class="user-role" id="sidebarUserRole"></div></div>
      </div>
      <button class="logout-btn" data-logout="index.html">Log out</button>
    </div>
  </aside>

  <main class="dash-main">
    <div class="dash-topbar">
      <h2 id="topbarTitle">My Profile</h2>
      <span class="badge badge-blue">EMPLOYEE</span>
    </div>

    <div class="dash-content">

      <!-- PROFILE -->
      <section class="dash-panel active" id="panel-profile">
        <div class="panel-card" id="profileCard"></div>
        <p class="locked-note">You can only view your own record. Other employees' details are not accessible from this login.</p>
      </section>

      <!-- TEAM -->
      <section class="dash-panel" id="panel-team">
        <div class="panel-card">
          <div class="panel-title"><h3>My team</h3></div>
          <div class="table-scroll"><table class="dash-table" id="empTeamTable"></table></div>
        </div>
      </section>

      <!-- PROJECTS -->
      <section class="dash-panel" id="panel-projects">
        <div class="panel-card">
          <div class="panel-title"><h3>Projects I'm working on</h3></div>
          <div id="empProjects"></div>
        </div>
      </section>

      <!-- TASKS -->
      <section class="dash-panel" id="panel-tasks">
        <div class="panel-card">
          <div class="panel-title"><h3>My tasks</h3></div>
          <div class="table-scroll"><table class="dash-table" id="empTasksTable"></table></div>
        </div>
      </section>

      <!-- LEAVE -->
      <section class="dash-panel" id="panel-leave">
        <div class="panel-card">
          <div class="panel-title"><h3>Request leave</h3></div>
          <form id="leaveForm" style="max-width:420px;">
            <div class="field"><label>From date</label><input type="date" id="lvFrom" required></div>
            <div class="field"><label>To date</label><input type="date" id="lvTo" required></div>
            <div class="field"><label>Reason</label><textarea id="lvReason" rows="3"></textarea></div>
            <button type="submit" class="btn btn-primary">Submit Request</button>
          </form>
          <div id="leaveList" style="margin-top:20px;"></div>
        </div>
      </section>

    </div>
  </main>
</div>

<script src="../js/data.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
<script src="../js/dashboard-common.js"></script>
<script src="../js/employee-dashboard.js"></script>
</body>
</html>
