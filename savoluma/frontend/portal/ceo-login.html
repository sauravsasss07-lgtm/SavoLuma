<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEO Login — SavoLuma Portal</title>
<link rel="icon" type="image/jpeg" href="../assets/images/favicon.jpeg">
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/portal-login.css">
</head>
<body class="portal-body">

<header class="portal-header">
  <div class="container flex-between">
    <a href="../index.html" class="brand"><img src="../assets/images/logo.jpeg" alt="SavoLuma logo"></a>
    <a href="index.html" class="btn btn-ghost btn-sm">← All logins</a>
  </div>
</header>

<main class="portal-main">
  <div class="auth-card">
    <span class="badge badge-blue auth-role-tag">CEO</span>
    <h2>CEO Login</h2>
    <p class="auth-sub">Full visibility across every project, team and business metric.</p>
    <div class="auth-error" id="authError"></div>
    <form id="loginForm" data-role="CEO" data-redirect="ceo-dashboard.html">
      <div class="field"><label for="loginUsername">Username</label><input id="loginUsername" required autocomplete="username"></div>
      <div class="field"><label for="loginPassword">Password</label><input id="loginPassword" type="password" required autocomplete="current-password"></div>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>
    <div class="auth-demo-hint">Demo credentials — username: <strong>ceo</strong>, password: <strong>Ceo@1234</strong></div>
    <div class="auth-links"><a href="index.html">Not CEO? Choose another role</a></div>
  </div>
</main>

<script src="../js/data.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/portal-login.js"></script>
</body>
</html>
