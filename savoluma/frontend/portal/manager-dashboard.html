<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  // Synchronous pre-render access check. Runs before any CSS/body paints,
  // so an unauthenticated or wrong-role visit never shows so much as a
  // flash of this page's shell — it redirects immediately. This is a
  // client-side hardening layer; the actual security boundary is the
  // backend REST API (see backend/src/main/java/com/savoluma/config/
  // SecurityConfig.java), which independently rejects any request without
  // a valid MANAGER JWT regardless of what the browser does here.
  (function() {
    try {
      var raw = localStorage.getItem('savoluma_session_v1');
      var session = raw ? JSON.parse(raw) : null;
      if (!session || !session.token || session.role !== 'MANAGER') {
        window.location.replace('manager-login.html');
      }
    } catch (e) {
      window.location.replace('manager-login.html');
    }
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manager Dashboard — SavoLuma</title>
<link rel="icon" type="image/jpeg" href="../assets/images/favicon.jpeg">
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/manager-dashboard.css">
</head>
<body class="dash-body">

<div class="dash-shell">
  <aside class="dash-sidebar">
    <div class="brand-row"><img src="../assets/images/logo.jpeg" alt="SavoLuma"></div>
    <div class="role-pill">MANAGER WORKSPACE</div>
    <nav class="dash-nav">
      <button class="active" data-panel="panel-workspace" data-title="Manager Workspace">Manager Workspace</button>
      <button data-panel="panel-team" data-title="My Team">My Team</button>
      <button data-panel="panel-projects" data-title="My Projects">My Projects</button>
      <button data-panel="panel-tasks" data-title="Task Board">Task Board</button>
      <button data-panel="panel-attendance" data-title="Attendance &amp; Work Hours">Attendance &amp; Work Hours</button>
    </nav>
    <div class="sidebar-footer">
      <div class="user-row">
        <div class="avatar-circle" id="sidebarAvatar"></div>
        <div><div class="user-name" id="sidebarUserName"></div><div class="user-role" id="sidebarUserRole"></div></div>
      </div>
      <button class="logout-btn" data-logout="index.html">Log out</button>
    </div>
  </aside>

  <main class="dash-main">
    <div class="dash-topbar">
      <h2 id="topbarTitle">Manager Workspace</h2>
      <span class="badge badge-blue">MANAGER</span>
    </div>

    <div class="dash-content">

      <!-- WORKSPACE (overview) -->
      <section class="dash-panel active" id="panel-workspace">
        <div class="stat-row" id="mgrStatRow"></div>
        <div class="panel-card">
          <div class="panel-title"><h3>Projects you manage</h3></div>
          <div class="table-scroll"><table class="dash-table" id="mgrProjectsOverviewTable"></table></div>
        </div>
      </section>

      <!-- TEAM -->
      <section class="dash-panel" id="panel-team">
        <div class="panel-card">
          <div class="panel-title"><h3>My team</h3></div>
          <div class="table-scroll"><table class="dash-table" id="mgrTeamTable"></table></div>
        </div>
      </section>

      <!-- PROJECTS -->
      <section class="dash-panel" id="panel-projects">
        <div class="panel-card">
          <div class="panel-title"><h3>Project status</h3></div>
          <div id="mgrProjectsDetail"></div>
        </div>
      </section>

      <!-- TASKS -->
      <section class="dash-panel" id="panel-tasks">
        <div class="panel-card">
          <div class="panel-title">
            <h3>Task board</h3>
            <button class="btn btn-primary btn-sm" data-modal-open="assignTaskModal">+ Assign Task</button>
          </div>
          <div class="kanban-row" id="kanbanRow"></div>
        </div>
      </section>

      <!-- ATTENDANCE -->
      <section class="dash-panel" id="panel-attendance">
        <div class="panel-card">
          <div class="panel-title"><h3>Team attendance / minutes worked (today)</h3></div>
          <div class="table-scroll"><table class="dash-table" id="mgrAttendanceTable"></table></div>
        </div>
      </section>

    </div>
  </main>
</div>

<!-- Assign task modal -->
<div class="modal-overlay" id="assignTaskModal">
  <div class="modal-box">
    <div class="modal-head"><h3>Assign Task</h3><button class="modal-close" data-modal-close>&times;</button></div>
    <form id="assignTaskForm">
      <div class="field"><label>Project</label><select id="atProject"></select></div>
      <div class="field"><label>Task title</label><input id="atTitle" required></div>
      <div class="field"><label>Assign to</label><select id="atEmployee"></select></div>
      <div class="form-row">
        <div class="field"><label>Priority</label><select id="atPriority"><option>LOW</option><option selected>MEDIUM</option><option>HIGH</option></select></div>
        <div class="field"><label>Due date</label><input id="atDue" type="date"></div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Assign Task</button>
    </form>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
<script src="../js/dashboard-common.js"></script>
<script src="../js/manager-dashboard.js"></script>
</body>
</html>
