spring:
  application:
    name: savoluma-platform

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:savoluma_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Foundation strategy (Phase 0):
      # - Default remains 'update' so existing local databases are never dropped
      #   or rejected; Hibernate only ADDS missing tables/columns to match entities.
      # - schema.sql is the documented DDL for greenfield installs (plus the
      #   additive section at the bottom). It is not executed automatically.
      # - Set JPA_DDL_AUTO=validate in production only AFTER schema.sql (including
      #   the additive section) has been applied to that database.
      # - Never set this to 'create' or 'create-drop'.
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

# Never commit a real secret here — always override via the JWT_SECRET
# environment variable in every environment (local .env, CI, production).
app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_THIS_SECRET_BEFORE_ANY_REAL_USE_MIN_256_BITS}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}      # 1 hour access token
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
  security:
    two-factor-required-roles: ADMIN,CEO,SUPER_ADMIN
    two-factor-dev-return-code: ${TWO_FACTOR_DEV_RETURN:false}
  upload:
    dir: ${APP_UPLOAD_DIR:${user.home}/savoluma-uploads}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.savoluma: DEBUG
    org.springframework.security: INFO
  # Never log passwords, JWTs, or raw personal data — see AuditService for
  # the approved pattern for business-action logging.
